<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Madhyamik PYQ — PDF Library & Reader</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg-app: #0f1117; --bg-bar: #161922; --bg-side: #13161f;
      --bg-card: #1c202d; --bg-hover: #262b3d; --border: #2a3042;
      --text: #eef1f8; --muted: #9aa3b8; --accent: #6366f1; --accent-h: #4f46e5;
      --danger: #ef4444; --shadow: 0 10px 28px rgba(0,0,0,0.45);
    }
    [data-theme="light"] {
      --bg-app: #eef1f6; --bg-bar: #ffffff; --bg-side: #f8fafc;
      --bg-card: #ffffff; --bg-hover: #eef2f7; --border: #d8dee9;
      --text: #111827; --muted: #6b7280; --shadow: 0 8px 22px rgba(0,0,0,0.12);
    }
    [data-theme="sepia"] {
      --bg-app: #e7dec8; --bg-bar: #f4ecd8; --bg-side: #efe5ce;
      --bg-card: #faf4e6; --bg-hover: #e5d8bc; --border: #d3c4a3;
      --text: #3b2f1e; --muted: #78654b; --accent: #b45309; --accent-h: #92400e;
      --shadow: 0 8px 22px rgba(59,47,30,0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%; overflow: hidden; display: flex; flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-app); color: var(--text);
    }
    #progress { position: fixed; top: 0; left: 0; height: 3px; width: 0%; background: linear-gradient(90deg, var(--accent), #a855f7); z-index: 999; transition: width .15s; }

    /* === Bulletproof Responsive Toolbar === */
    .toolbar {
      background: var(--bg-bar); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 8px; gap: 6px; min-height: 48px; flex-shrink: 0;
      position: relative; z-index: 60; user-select: none;
    }
    .tb-group { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .brand { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap; padding: 0 4px; }
    .brand span { background: var(--accent); color: #fff; font-size: 10px; padding: 2px 5px; border-radius: 4px; }

    .btn {
      background: transparent; border: 1px solid transparent; color: var(--text);
      height: 32px; min-width: 32px; padding: 0 7px; border-radius: 7px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      font-size: 12.5px; font-weight: 500; white-space: nowrap; flex-shrink: 0;
      transition: background .15s, border-color .15s;
    }
    .btn:hover { background: var(--bg-hover); }
    .btn.active { background: rgba(99,102,241,0.18); color: var(--accent); border-color: rgba(99,102,241,0.4); }
    .btn-outline { border-color: var(--border); background: var(--bg-card); }
    .btn-primary { background: var(--accent); color: #fff; font-weight: 600; padding: 0 10px; }
    .btn-primary:hover { background: var(--accent-h); }
    .btn svg { width: 16px; height: 16px; flex-shrink: 0; }

    .page-nav {
      display: flex; align-items: center; gap: 3px; height: 32px; padding: 0 7px;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 7px;
      font-size: 12.5px; white-space: nowrap; flex-shrink: 0;
    }
    .page-nav input {
      width: 30px; background: transparent; border: none; color: var(--text);
      text-align: center; font-size: 12.5px; font-weight: 700; outline: none;
      -moz-appearance: textfield; appearance: textfield;
    }
    .page-nav input::-webkit-outer-spin-button,
    .page-nav input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .page-nav span { color: var(--muted); white-space: nowrap; }

    select.tb-select {
      height: 32px; background: var(--bg-card); color: var(--text);
      border: 1px solid var(--border); border-radius: 7px; padding: 0 5px;
      font-size: 12px; outline: none; cursor: pointer; flex-shrink: 0;
    }

    /* More Tools Popover Menu */
    .more-menu {
      position: fixed; top: 52px; right: 10px; width: 245px; max-width: calc(100vw - 20px);
      background: var(--bg-bar); border: 1px solid var(--border); border-radius: 12px;
      box-shadow: var(--shadow); padding: 8px; display: none; flex-direction: column; gap: 4px; z-index: 120;
    }
    .more-menu.open { display: flex; }
    .menu-item {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 10px; border-radius: 7px; font-size: 13px; cursor: pointer;
      background: transparent; border: none; color: var(--text); width: 100%; text-align: left;
    }
    .menu-item:hover { background: var(--bg-hover); }
    .menu-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 6px 10px; font-size: 12.5px; color: var(--muted);
    }
    .menu-sep { height: 1px; background: var(--border); margin: 4px 0; }

    /* Visibility rules */
    body.mode-library .pdf-only { display: none !important; }
    body.embed-mode .hide-in-embed { display: none !important; }
    body.no-download .download-only { display: none !important; }
    body.single-embed .library-only { display: none !important; }

    /* Responsive breakpoints tailored for Blogger PC & Mobile */
    @media (max-width: 960px) {
      body:not(.mode-library) .brand { display: none !important; }
      .hide-md { display: none !important; }
    }
    @media (max-width: 560px) {
      .hide-xs { display: none !important; }
      .toolbar { padding: 5px 6px; gap: 4px; flex-wrap: wrap; justify-content: space-between; }
      .btn { height: 30px; min-width: 30px; padding: 0 5px; font-size: 12px; }
      .page-nav, select.tb-select { height: 30px; font-size: 12px; }
      .page-nav { padding: 0 5px; }
      .page-nav input { width: 26px; }
    }

    /* Workspace & Sidebar */
    .workspace { flex: 1; min-height: 0; display: flex; position: relative; }
    .sidebar {
      width: 280px; background: var(--bg-side); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; flex-shrink: 0; z-index: 50;
      transition: margin-left .2s ease;
    }
    .sidebar.collapsed { margin-left: -280px; }
    @media (max-width: 820px) {
      .sidebar { position: absolute; top: 0; bottom: 0; left: 0; margin-left: 0 !important; box-shadow: var(--shadow); transition: transform .2s ease; }
      .sidebar.collapsed { transform: translateX(-105%); }
    }
    .sb-tabs { display: flex; border-bottom: 1px solid var(--border); padding: 6px; gap: 3px; }
    .sb-tab { flex: 1; background: none; border: none; color: var(--muted); padding: 7px 3px; border-radius: 6px; font-size: 11.5px; font-weight: 600; cursor: pointer; }
    .sb-tab.active { background: var(--bg-hover); color: var(--text); }
    .sb-panel { flex: 1; overflow-y: auto; padding: 10px; display: none; }
    .sb-panel.active { display: block; }
    .sb-search { width: 100%; height: 33px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 7px; padding: 0 10px; color: var(--text); font-size: 12.5px; outline: none; margin-bottom: 10px; }
    .sb-item { display: flex; align-items: center; gap: 7px; padding: 7px 8px; border-radius: 7px; cursor: pointer; font-size: 12.5px; margin-bottom: 3px; border: 1px solid transparent; word-break: break-word; }
    .sb-item:hover { background: var(--bg-hover); }
    .sb-item.active { background: rgba(99,102,241,0.16); border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .sb-ftitle { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin: 10px 4px 5px; }

    /* Viewer & Library */
    .viewer { flex: 1; overflow: auto; display: flex; flex-direction: column; align-items: center; padding: 16px 12px 50px; scroll-behavior: smooth; }
    .library-view { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 14px; }
    .lib-header { background: var(--bg-bar); border: 1px solid var(--border); border-radius: 13px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); }
    .lib-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .lib-top h1 { font-size: 17px; }
    .lib-search { width: 100%; height: 38px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 0 12px; color: var(--text); font-size: 13px; outline: none; }
    .lib-search:focus { border-color: var(--accent); }
    .crumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 12.5px; color: var(--muted); }
    .crumb { background: var(--bg-card); border: 1px solid var(--border); padding: 4px 10px; border-radius: 99px; cursor: pointer; color: var(--text); }
    .crumb.current { background: var(--accent); border-color: var(--accent); color: #fff; cursor: default; }
    .sec-title { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--muted); letter-spacing: .5px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 11px; }
    .card { background: var(--bg-bar); border: 1px solid var(--border); border-radius: 11px; padding: 13px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; cursor: pointer; transition: border-color .15s, transform .12s; }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card-head { display: flex; gap: 10px; align-items: flex-start; }
    .c-ico { width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .c-ico.f { background: rgba(245,158,11,.16); }
    .c-ico.p { background: rgba(239,68,68,.16); }
    .c-title { font-size: 13.5px; font-weight: 600; line-height: 1.35; word-break: break-word; }
    .c-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; word-break: break-word; }
    .c-foot { display: flex; justify-content: space-between; align-items: center; padding-top: 8px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--muted); }
    .mini-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text); font-size: 11.5px; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .mini-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* Pages & Thumbnails */
    #pages-wrapper { display: none; flex-direction: column; align-items: center; gap: 16px; width: 100%; }
    #pages-wrapper.view-book { display: grid; grid-template-columns: repeat(2, auto); justify-content: center; gap: 14px; }
    #pages-wrapper.view-single .page-shell { display: none; }
    #pages-wrapper.view-single .page-shell.current-single { display: block; }
    .page-shell { position: relative; background: #fff; box-shadow: var(--shadow); border-radius: 4px; overflow: hidden; }
    .page-shell canvas { display: block; }
    .page-badge { position: absolute; bottom: 8px; right: 10px; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; padding: 2px 7px; border-radius: 99px; pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 5; }
    .page-shell:hover .page-badge { opacity: 1; }
    body.pdf-dark-mode .page-shell canvas { filter: invert(0.9) hue-rotate(180deg) contrast(0.95); }
    body.pdf-dark-mode .page-shell { background: #1a1a1a; }

    .textLayer { opacity: 1; line-height: 1; }
    .textLayer span::selection { background: rgba(99,102,241,0.35); }
    .textLayer .hl { background: rgba(250,204,21,0.55) !important; color: transparent !important; border-radius: 2px; }
    .textLayer .hl.cur { background: rgba(249,115,22,0.75) !important; outline: 2px solid #f97316; }

    .thumb-card { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 7px; margin-bottom: 9px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; background: var(--bg-card); }
    .thumb-card.active { border-color: var(--accent); }
    .thumb-card canvas { max-width: 100%; height: auto; border-radius: 4px; background: #fff; }
    .outline-item { padding: 6px 8px; border-radius: 6px; font-size: 12.5px; cursor: pointer; }
    .outline-item:hover { background: var(--bg-hover); color: var(--accent); }
    .note-box { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .note-box textarea { width: 100%; min-height: 60px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 7px; padding: 8px; color: var(--text); font-size: 12.5px; font-family: inherit; outline: none; }
    .bm-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 7px; font-size: 12.5px; }

    /* Search Bar, TTS, Loader, Modals, Toast */
    .search-bar { position: fixed; top: 54px; right: 12px; background: var(--bg-bar); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); padding: 8px; display: none; flex-direction: column; gap: 7px; width: 320px; max-width: calc(100vw - 24px); z-index: 95; }
    .search-bar.open { display: flex; }
    .search-row { display: flex; gap: 5px; }
    .search-row input { flex: 1; height: 32px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 7px; padding: 0 9px; color: var(--text); font-size: 12.5px; outline: none; }
    .search-list { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .search-item { padding: 6px 8px; border-radius: 6px; background: var(--bg-card); cursor: pointer; font-size: 12px; border: 1px solid transparent; }
    .search-item.active, .search-item:hover { border-color: var(--accent); }
    .search-item mark { background: #facc15; color: #000; padding: 0 2px; border-radius: 2px; }

    .tts-bar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--bg-bar); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 99px; padding: 5px 12px; display: none; align-items: center; gap: 6px; z-index: 95; font-size: 12px; }
    .tts-bar.open { display: flex; }

    .loader { position: fixed; inset: 0; background: rgba(15,17,23,.72); backdrop-filter: blur(4px); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 200; color: #fff; font-size: 14px; }
    .loader.show { display: flex; }
    .spin { width: 38px; height: 38px; border: 4px solid rgba(255,255,255,.2); border-top-color: var(--accent); border-radius: 50%; animation: sp .8s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }

    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none; align-items: center; justify-content: center; padding: 14px; z-index: 300; }
    .modal-bg.open { display: flex; }
    .modal { background: var(--bg-bar); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; padding: 20px; box-shadow: var(--shadow); }
    .modal-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 11px; }
    .field label { font-size: 12px; font-weight: 600; color: var(--muted); }
    .field input, .field select, .field textarea { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; color: var(--text); font-size: 13px; outline: none; font-family: inherit; }
    .field textarea.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; min-height: 110px; }
    .f-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .checks { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; font-size: 12.5px; }
    .checks label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
    .toast { position: fixed; bottom: 18px; right: 18px; background: var(--bg-card); color: var(--text); border: 1px solid var(--accent); padding: 9px 14px; border-radius: 8px; font-size: 12.5px; z-index: 400; opacity: 0; transform: translateY(8px); transition: all .2s; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 600px) { #pages-wrapper.view-book, .f-grid { grid-template-columns: 1fr; } }
    @media print { .toolbar, .sidebar, .search-bar, .tts-bar, #progress { display: none !important; } .workspace, .viewer { height: auto !important; overflow: visible !important; padding: 0 !important; } .page-shell { box-shadow: none !important; page-break-after: always; } }
  </style>
</head>
<body class="mode-library">
  <div id="progress"></div>

  <!-- Clean, Zero-Cutoff Header -->
  <header class="toolbar">
    <div class="tb-group">
      <button class="btn" id="btn-sidebar" title="Sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
      </button>
      <div class="brand" id="btn-home">Madhyamik PYQ <span>PDF</span></div>
      <button class="btn btn-outline pdf-only library-only" id="btn-back-lib" title="Back to Library">
        ← <span class="hide-md">Library</span>
      </button>
    </div>

    <div class="tb-group pdf-only">
      <button class="btn" id="btn-prev" title="Previous Page">‹</button>
      <div class="page-nav">
        <input type="number" id="page-input" value="1" min="1" aria-label="Page" />
        <span>/ <b id="page-count">0</b></span>
      </div>
      <button class="btn" id="btn-next" title="Next Page">›</button>
    </div>

    <div class="tb-group pdf-only">
      <button class="btn hide-xs" id="btn-zoom-out" title="Zoom Out">−</button>
      <select class="tb-select" id="zoom-select" title="Zoom">
        <option value="fit-width" selected>Fit</option>
        <option value="fit-page">Page</option>
        <option value="0.75">75%</option>
        <option value="1">100%</option>
        <option value="1.25">125%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
      </select>
      <button class="btn hide-xs" id="btn-zoom-in" title="Zoom In">+</button>
    </div>

    <div class="tb-group">
      <button class="btn pdf-only" id="btn-search" title="Search in PDF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="btn pdf-only download-only" id="btn-download" title="Download PDF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="btn btn-primary hide-in-embed hide-md" id="btn-embed-top">&lt;/&gt; Embed</button>
      <button class="btn" id="btn-more" title="More Tools">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
      </button>
    </div>
  </header>

  <!-- More Tools Dropdown (Keeps Header 100% Clean on PC & Mobile) -->
  <div class="more-menu" id="more-menu">
    <button class="menu-item pdf-only" id="m-dark"><span>🌙 Night Mode (PDF)</span><b id="m-dark-st">OFF</b></button>
    <div class="menu-row">
      <span>🎨 UI Theme</span>
      <select class="tb-select" id="theme-select"><option value="dark">Dark</option><option value="light">Light</option><option value="sepia">Sepia</option></select>
    </div>
    <div class="menu-row pdf-only">
      <span>📖 Layout</span>
      <select class="tb-select" id="view-mode"><option value="continuous">Scroll</option><option value="single">Single</option><option value="book">Book</option></select>
    </div>
    <div class="menu-sep pdf-only"></div>
    <button class="menu-item pdf-only" id="m-rotate"><span>⟳ Rotate 90°</span></button>
    <button class="menu-item pdf-only" id="m-tts"><span>🔊 Read Page Aloud</span></button>
    <button class="menu-item pdf-only" id="m-bookmark"><span>🔖 Bookmark Page</span></button>
    <button class="menu-item" id="m-fullscreen"><span>⛶ Fullscreen</span></button>
    <div class="menu-sep hide-in-embed"></div>
    <button class="menu-item hide-in-embed" id="m-open"><span>📂 Open Custom / Local PDF</span></button>
    <button class="menu-item hide-in-embed" id="m-embed"><span>&lt;/&gt; Blogger Embed Code</span></button>
  </div>

  <!-- Search Box -->
  <div class="search-bar" id="search-bar">
    <div class="search-row">
      <input type="text" id="search-input" placeholder="Search text inside PDF..." />
      <button class="btn" id="search-prev">↑</button>
      <button class="btn" id="search-next">↓</button>
      <button class="btn" id="search-close">✕</button>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);">
      <span id="search-status">Type to search</span><span id="search-counter"></span>
    </div>
    <div class="search-list" id="search-results"></div>
  </div>

  <!-- TTS Floating Bar -->
  <div class="tts-bar" id="tts-bar">
    <span id="tts-st">🔊 Ready</span>
    <button class="btn" id="tts-play">Play</button>
    <button class="btn" id="tts-stop">Stop</button>
    <select class="tb-select" id="tts-rate" style="height:26px;"><option value="0.8">0.8x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option></select>
    <button class="btn" id="tts-close">✕</button>
  </div>

  <!-- Workspace -->
  <div class="workspace">
    <aside class="sidebar collapsed" id="sidebar">
      <div class="sb-tabs">
        <button class="sb-tab active library-only" data-tab="library">Files</button>
        <button class="sb-tab" data-tab="thumbs">Pages</button>
        <button class="sb-tab" data-tab="outline">TOC</button>
        <button class="sb-tab" data-tab="notes">Notes</button>
      </div>
      <div class="sb-panel active" id="panel-library">
        <input type="text" class="sb-search" id="sb-search" placeholder="Filter PDFs..." />
        <div id="sb-files">Loading...</div>
      </div>
      <div class="sb-panel" id="panel-thumbs"></div>
      <div class="sb-panel" id="panel-outline"><p style="color:var(--muted);font-size:12.5px;">Open a PDF to see TOC.</p></div>
      <div class="sb-panel" id="panel-notes">
        <div class="note-box">
          <strong style="font-size:12px;">Note for Page <span id="note-pg">1</span></strong>
          <textarea id="note-input" placeholder="Write a note..."></textarea>
          <button class="btn btn-primary" id="btn-save-note" style="width:100%;">Save Bookmark</button>
        </div>
        <div id="bm-list"></div>
      </div>
    </aside>

    <main class="viewer" id="viewer">
      <section class="library-view" id="library-view">
        <div class="lib-header">
          <div class="lib-top">
            <h1>📚 <span id="lib-title">Madhyamik PYQ PDF Library</span></h1>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <button class="btn btn-outline hide-in-embed" id="btn-embed-folder">🔗 Embed Folder</button>
              <button class="btn btn-outline" id="btn-refresh">↻ Refresh</button>
            </div>
          </div>
          <input type="text" class="lib-search" id="lib-search" placeholder="🔍 Search Subject, Medium, or Year (e.g., 2026, maths, history)..." />
          <div class="crumbs" id="crumbs"></div>
        </div>
        <div id="lib-content"><p style="color:var(--muted);text-align:center;padding:30px;">Loading folders from GitHub...</p></div>
      </section>
      <div id="pages-wrapper"></div>
    </main>
  </div>

  <div class="loader" id="loader"><div class="spin"></div><div id="loader-text">Loading PDF...</div></div>

  <!-- Custom PDF Modal -->
  <div class="modal-bg" id="open-modal">
    <div class="modal">
      <div class="modal-h"><h3>Open Custom GitHub / Local PDF</h3><button class="btn" data-close="open-modal">✕</button></div>
      <div class="field"><label>GitHub PDF Link</label><input type="url" id="modal-url" placeholder="https://github.com/prasanta28887-math/madhyamik-pyq-pdf/blob/main/..." /></div>
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-outline" id="btn-local">📁 Local File</button>
        <input type="file" id="file-input" accept="application/pdf" hidden />
        <button class="btn btn-primary" id="btn-load-url">Load PDF</button>
      </div>
    </div>
  </div>

  <!-- Blogger Embed Modal -->
  <div class="modal-bg" id="embed-modal">
    <div class="modal">
      <div class="modal-h"><h3>🚀 Blogger Embed Code</h3><button class="btn" data-close="embed-modal">✕</button></div>
      <div class="field">
        <label>Embed Type</label>
        <select id="emb-type">
          <option value="pdf">Single PDF File</option>
          <option value="folder">Subject / Folder (All PDFs inside)</option>
          <option value="library">Full PDF Library</option>
        </select>
      </div>
      <div class="field" id="emb-pdf-wrap"><label>PDF Path or GitHub Link</label><input type="text" id="emb-pdf" /></div>
      <div class="field" id="emb-dir-wrap" style="display:none;"><label>Folder Path</label><input type="text" id="emb-dir" /></div>
      <div class="f-grid">
        <div class="field"><label>Theme</label><select id="emb-theme"><option value="dark">Dark</option><option value="light">Light</option><option value="sepia">Sepia</option></select></div>
        <div class="field"><label>Height</label><input type="text" id="emb-h" value="760px" /></div>
      </div>
      <div class="checks">
        <label><input type="checkbox" id="emb-clean" checked /> Clean Mode</label>
        <label><input type="checkbox" id="emb-dl" checked /> Allow Download</label>
        <label><input type="checkbox" id="emb-dark" /> Dark PDF</label>
      </div>
      <div class="field"><label>Paste in Blogger (HTML View)</label><textarea class="code" id="emb-out" readonly></textarea></div>
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button class="btn btn-outline" id="btn-emb-prev">Preview</button>
        <button class="btn btn-primary" id="btn-emb-copy">📋 Copy Code</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const REPO = {
      owner: 'prasanta28887-math',
      name: 'madhyamik-pyq-pdf',
      branch: 'main',
      readerBase: 'https://prasanta28887-math.github.io/madhyamik-pyq-pdf/'
    };
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const $ = (id) => document.getElementById(id);
    const viewer = $('viewer'), wrap = $('pages-wrapper');
    const st = {
      files: [], folder: '', lockRoot: '', pdf: null, path: '', url: '', fbUrl: '', key: '',
      page: 1, total: 0, scale: 1.25, zoom: 'fit-width', rot: 0, view: 'continuous',
      pObs: null, tObs: null, rPages: new Set(), rThumbs: new Set(), tasks: new Map(),
      texts: [], q: '', matches: [], mIdx: -1, tts: false
    };

    const toast = (m) => { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2400); };
    const esc = (s) => String(s || '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    const pretty = (s) => s.replace(/\.pdf$/i,'').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim().replace(/\b\w/g,(c)=>c.toUpperCase());
    const fSize = (b) => !b ? '' : b < 1048576 ? (b/1024).toFixed(0)+' KB' : (b/1048576).toFixed(2)+' MB';
    const encP = (p) => p.split('/').map(encodeURIComponent).join('/');
    const setLoad = (s, t='Loading...') => { $('loader-text').textContent = t; $('loader').classList.toggle('show', s); };

    function resolveInput(inp) {
      inp = (inp || '').trim();
      if (!inp) return { p: '', f: '', rel: '' };
      const b = inp.match(/^https?:\/\/github\.com\/([^\/]+)\/([^\/]+)\/blob\/([^\/]+)\/(.+)$/);
      if (b) return { p: `https://cdn.jsdelivr.net/gh/${b[1]}/${b[2]}@${b[3]}/${b[4]}`, f: `https://raw.githubusercontent.com/${b[1]}/${b[2]}/${b[3]}/${b[4]}`, rel: (b[1]===REPO.owner && b[2]===REPO.name) ? decodeURIComponent(b[4]) : '' };
      if (/^https?:\/\//i.test(inp)) {
        const r = inp.match(/^https?:\/\/raw\.githubusercontent\.com\/([^\/]+)\/([^\/]+)\/([^\/]+)\/(.+)$/);
        if (r) return { p: `https://cdn.jsdelivr.net/gh/${r[1]}/${r[2]}@${r[3]}/${r[4]}`, f: inp, rel: (r[1]===REPO.owner && r[2]===REPO.name) ? decodeURIComponent(r[4]) : '' };
        return { p: inp, f: '', rel: '' };
      }
      const clean = inp.replace(/^\/+/, ''), ep = encP(clean);
      return { p: `https://cdn.jsdelivr.net/gh/${REPO.owner}/${REPO.name}@${REPO.branch}/${ep}`, f: `https://raw.githubusercontent.com/${REPO.owner}/${REPO.name}/${REPO.branch}/${ep}`, rel: clean };
    }

    // === Auto GitHub Folder/Subfolder Discovery ===
    async function fetchTree(force = false) {
      const ck = `tree_${REPO.owner}_${REPO.name}`;
      if (!force) {
        try {
          const c = JSON.parse(sessionStorage.getItem(ck) || 'null');
          if (c && Date.now() - c.t < 600000 && c.f?.length) { st.files = c.f; renderLib(); renderSbFiles(); return; }
        } catch {}
      }
      let list = [];
      try {
        const r = await fetch(`https://api.github.com/repos/${REPO.owner}/${REPO.name}/git/trees/${REPO.branch}?recursive=1`);
        if (r.ok) list = ((await r.json()).tree || []).filter((x) => x.type === 'blob' && /\.pdf$/i.test(x.path)).map((x) => {
          const ps = x.path.split('/'), name = ps.pop();
          return { path: x.path, name, folder: ps.join('/'), size: x.size || 0 };
        });
      } catch {}
      if (!list.length) {
        try {
          const r = await fetch(`https://data.jsdelivr.com/v1/packages/gh/${REPO.owner}/${REPO.name}@${REPO.branch}?structure=flat`);
          if (r.ok) list = ((await r.json()).files || []).filter((x) => /\.pdf$/i.test(x.name)).map((x) => {
            const cl = x.name.replace(/^\/+/, ''), ps = cl.split('/'), name = ps.pop();
            return { path: cl, name, folder: ps.join('/'), size: x.size || 0 };
          });
        } catch {}
      }
      list.sort((a, b) => b.name.localeCompare(a.name, undefined, { numeric: true }));
      st.files = list;
      if (list.length) try { sessionStorage.setItem(ck, JSON.stringify({ t: Date.now(), f: list })); } catch {}
      renderLib(); renderSbFiles();
    }

    function showLib(f = st.folder) {
      stopTTS(); st.folder = f;
      document.body.classList.add('mode-library');
      $('library-view').style.display = 'flex'; wrap.style.display = 'none';
      $('search-bar').classList.remove('open'); $('progress').style.width = '0%';
      renderLib();
    }
    function showReader() {
      document.body.classList.remove('mode-library');
      $('library-view').style.display = 'none';
      wrap.style.display = st.view === 'book' ? 'grid' : 'flex';
    }

    function renderLib() {
      const q = ($('lib-search').value || '').trim().toLowerCase();
      const lock = st.lockRoot, cur = st.folder || '';
      $('lib-title').textContent = cur ? pretty(cur.split('/').pop()) : 'Madhyamik PYQ PDF Library';

      const bc = $('crumbs'); bc.innerHTML = '';
      const addC = (lbl, path, act) => {
        const s = document.createElement('span'); s.className = 'crumb' + (act ? ' current' : ''); s.textContent = lbl;
        if (!act) s.onclick = () => { $('lib-search').value = ''; showLib(path); };
        bc.appendChild(s);
      };
      addC(lock ? '📁 ' + pretty(lock.split('/').pop()) : '🏠 All Subjects', lock, cur === lock && !q);
      if (cur && cur !== lock) {
        const pre = lock ? lock + '/' : '', rel = cur.startsWith(pre) ? cur.slice(pre.length) : cur;
        let acc = lock;
        rel.split('/').filter(Boolean).forEach((seg, i, arr) => {
          acc = acc ? `${acc}/${seg}` : seg;
          bc.appendChild(document.createTextNode(' › '));
          addC(pretty(seg), acc, i === arr.length - 1 && !q);
        });
      }

      const box = $('lib-content');
      if (!st.files.length) { box.innerHTML = '<p style="color:var(--muted);text-align:center;padding:30px;">No PDFs found. Click Refresh.</p>'; return; }
      const scoped = lock ? st.files.filter((f) => f.folder === lock || f.folder.startsWith(lock + '/')) : st.files;

      if (q) {
        const m = scoped.filter((f) => f.path.toLowerCase().includes(q) || pretty(f.name).toLowerCase().includes(q));
        box.innerHTML = m.length ? `<div class="sec-title">Results (${m.length})</div><div class="grid" id="gp"></div>` : `<p style="color:var(--muted);text-align:center;padding:30px;">No PDFs for "${esc(q)}"</p>`;
        if (m.length) m.forEach((f) => $('gp').appendChild(pdfCard(f, true)));
        return;
      }

      const subs = new Map(), pdfs = [], pre = cur ? cur + '/' : '';
      scoped.forEach((f) => {
        if (f.folder === cur) pdfs.push(f);
        else if (!cur || f.folder.startsWith(pre)) {
          const next = (cur ? f.folder.slice(pre.length) : f.folder).split('/')[0];
          if (next) { const fp = cur ? `${cur}/${next}` : next; subs.set(fp, (subs.get(fp) || 0) + 1); }
        }
      });

      box.innerHTML = '';
      if (subs.size) {
        const t = document.createElement('div'); t.className = 'sec-title'; t.textContent = `Folders (${subs.size})`; box.appendChild(t);
        const g = document.createElement('div'); g.className = 'grid'; g.style.margin = '8px 0 18px';
        [...subs.entries()].sort((a,b) => a[0].localeCompare(b[0])).forEach(([sp, cnt]) => {
          const c = document.createElement('div'); c.className = 'card';
          c.innerHTML = `<div class="card-head"><div class="c-ico f">📁</div><div><div class="c-title">${esc(pretty(sp.split('/').pop()))}</div><div class="c-sub">${cnt} PDF${cnt>1?'s':''}</div></div></div><div class="c-foot"><span>Open →</span><button class="mini-btn hide-in-embed" data-ef="${esc(sp)}">&lt;/&gt; Embed</button></div>`;
          c.onclick = (e) => { const b = e.target.closest('[data-ef]'); if (b) { e.stopPropagation(); openEmbed('folder', b.dataset.ef); } else showLib(sp); };
          g.appendChild(c);
        });
        box.appendChild(g);
      }
      if (pdfs.length) {
        const t = document.createElement('div'); t.className = 'sec-title'; t.textContent = `PDFs (${pdfs.length})`; box.appendChild(t);
        const g = document.createElement('div'); g.className = 'grid'; g.style.marginTop = '8px';
        pdfs.forEach((f) => g.appendChild(pdfCard(f, false)));
        box.appendChild(g);
      }
    }

    function pdfCard(f, sub) {
      const c = document.createElement('div'); c.className = 'card';
      c.innerHTML = `<div class="card-head"><div class="c-ico p">📄</div><div><div class="c-title">${esc(pretty(f.name))}</div>${sub && f.folder ? `<div class="c-sub">📁 ${esc(f.folder.split('/').map(pretty).join(' › '))}</div>` : ''}</div></div><div class="c-foot"><span>${fSize(f.size) || 'PDF'}</span><div style="display:flex;gap:4px;"><button class="mini-btn hide-in-embed" data-ep="${esc(f.path)}">&lt;/&gt;</button><button class="mini-btn" style="background:var(--accent);color:#fff;border-color:var(--accent);">Read</button></div></div>`;
      c.onclick = (e) => { const b = e.target.closest('[data-ep]'); if (b) { e.stopPropagation(); openEmbed('pdf', b.dataset.ep); } else loadPDF(f.path); };
      return c;
    }

    function renderSbFiles() {
      const box = $('sb-files'), q = ($('sb-search').value || '').trim().toLowerCase(), lock = st.lockRoot;
      const list = st.files.filter((f) => (!lock || f.folder === lock || f.folder.startsWith(lock + '/')) && (!q || f.path.toLowerCase().includes(q) || pretty(f.name).toLowerCase().includes(q)));
      if (!list.length) { box.innerHTML = '<p style="color:var(--muted);font-size:12px;">No matching PDFs.</p>'; return; }
      const grp = new Map();
      list.forEach((f) => { const k = f.folder || 'Root'; if (!grp.has(k)) grp.set(k, []); grp.get(k).push(f); });
      box.innerHTML = '';
      [...grp.entries()].sort((a,b) => a[0].localeCompare(b[0])).forEach(([k, arr]) => {
        const h = document.createElement('div'); h.className = 'sb-ftitle'; h.textContent = '📁 ' + k.split('/').map(pretty).join(' › '); box.appendChild(h);
        arr.forEach((f) => {
          const d = document.createElement('div'); d.className = 'sb-item' + (st.path === f.path ? ' active' : '');
          d.innerHTML = `<span>📄</span><span>${esc(pretty(f.name))}</span>`;
          d.onclick = () => { loadPDF(f.path); if (window.innerWidth <= 820) $('sidebar').classList.add('collapsed'); };
          box.appendChild(d);
        });
      });
    }

    // === PDF Engine ===
    async function loadPDF(src, opts = {}) {
      setLoad(true, 'Opening PDF...');
      try {
        st.tasks.forEach((t) => { try { t.cancel(); } catch {} });
        st.tasks.clear(); st.rPages.clear(); st.rThumbs.clear(); st.texts = []; stopTTS();
        let doc;
        if (typeof src === 'string') {
          const inf = resolveInput(src);
          st.path = inf.rel; st.url = inf.p; st.fbUrl = inf.f;
          st.key = 'mpyq_' + btoa(unescape(encodeURIComponent(inf.rel || inf.p))).slice(0, 44);
          const getU = (u) => {
            const tk = pdfjsLib.getDocument({ url: u, cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/', cMapPacked: true });
            tk.onProgress = (p) => { if (p.total) $('loader-text').textContent = `Loading... ${Math.min(100, Math.round(p.loaded/p.total*100))}%`; };
            return tk.promise;
          };
          try { doc = await getU(st.url); }
          catch (e) { if (st.fbUrl && st.fbUrl !== st.url) { st.url = st.fbUrl; doc = await getU(st.fbUrl); } else throw e; }
        } else {
          st.path = ''; st.url = ''; st.key = 'mpyq_loc_' + (opts.name || 'f');
          doc = await pdfjsLib.getDocument(src).promise;
        }
        st.pdf = doc; st.total = doc.numPages;
        $('page-count').textContent = st.total; $('page-input').max = st.total;
        showReader(); renderSbFiles();
        const saved = parseInt(localStorage.getItem(st.key + '_p') || '1', 10);
        const start = Math.max(1, Math.min(st.total, opts.page || saved || 1));
        st.page = start;
        await calcScale(); await buildPages(); buildThumbs(); loadTOC(); renderBMs();
        goPage(start, false);
      } catch (e) {
        console.error(e);
        alert('PDF লোড হয়নি। Error: ' + (e.message || e));
      } finally { setLoad(false); }
    }

    async function calcScale() {
      if (!st.pdf) return;
      const vp = (await st.pdf.getPage(1)).getViewport({ scale: 1, rotation: st.rot });
      const w = viewer.clientWidth - (st.view === 'book' ? 44 : 24), h = viewer.clientHeight - 28;
      if (st.zoom === 'fit-width') st.scale = Math.max(0.4, Math.min(2.6, (w / (st.view === 'book' ? 2 : 1)) / vp.width));
      else if (st.zoom === 'fit-page') st.scale = Math.max(0.4, Math.min(2.6, Math.min(w / vp.width, h / vp.height)));
      else st.scale = parseFloat(st.zoom) || 1.25;
    }

    async function buildPages() {
      if (st.pObs) st.pObs.disconnect();
      st.rPages.clear(); wrap.innerHTML = '';
      wrap.className = st.view === 'book' ? 'view-book' : st.view === 'single' ? 'view-single' : '';
      wrap.style.display = st.view === 'book' ? 'grid' : 'flex';
      const est = (await st.pdf.getPage(1)).getViewport({ scale: st.scale, rotation: st.rot });
      const fr = document.createDocumentFragment();
      for (let i = 1; i <= st.total; i++) {
        const d = document.createElement('div'); d.className = 'page-shell'; d.dataset.page = i;
        d.style.width = `${Math.floor(est.width)}px`; d.style.height = `${Math.floor(est.height)}px`;
        d.innerHTML = `<canvas></canvas><div class="textLayer"></div><div class="page-badge">Page ${i}</div>`;
        fr.appendChild(d);
      }
      wrap.appendChild(fr);
      st.pObs = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) renderPage(+e.target.dataset.page); }), { root: viewer, rootMargin: '500px 0px' });
      wrap.querySelectorAll('.page-shell').forEach((el) => st.pObs.observe(el));
      if (st.view === 'single') updSingle();
    }

    async function renderPage(n) {
      if (!st.pdf || st.rPages.has(n)) return;
      const sh = wrap.querySelector(`.page-shell[data-page="${n}"]`); if (!sh) return;
      st.rPages.add(n);
      try {
        const pg = await st.pdf.getPage(n), vp = pg.getViewport({ scale: st.scale, rotation: st.rot });
        const rawScale = Math.max((window.devicePixelRatio || 1) * 1.6, 1900 / Math.max(vp.width, 1), 2.4);
        const dpr = Math.min(rawScale, 3800 / Math.max(vp.width, vp.height, 1), 3.5);
        sh.style.width = `${Math.floor(vp.width)}px`; sh.style.height = `${Math.floor(vp.height)}px`;
        const cv = sh.querySelector('canvas');
        cv.width = Math.floor(vp.width * dpr); cv.height = Math.floor(vp.height * dpr);
        cv.style.width = `${Math.floor(vp.width)}px`; cv.style.height = `${Math.floor(vp.height)}px`;
        const ctx = cv.getContext('2d', { alpha: false });
        ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
        const tk = pg.render({ canvasContext: ctx, viewport: vp, transform: dpr !== 1 ? [dpr,0,0,dpr,0,0] : null });
        st.tasks.set(n, tk); await tk.promise; st.tasks.delete(n);
        const tl = sh.querySelector('.textLayer'); tl.innerHTML = '';
        tl.style.width = `${Math.floor(vp.width)}px`; tl.style.height = `${Math.floor(vp.height)}px`;
        tl.style.setProperty('--scale-factor', vp.scale);
        await pdfjsLib.renderTextLayer({ textContentSource: await pg.getTextContent(), container: tl, viewport: vp, textDivs: [] }).promise;
        if (st.q) highlightPage(n);
      } catch (e) { if (e?.name !== 'RenderingCancelledException') st.rPages.delete(n); }
    }

    function buildThumbs() {
      if (st.tObs) st.tObs.disconnect();
      const box = $('panel-thumbs'); box.innerHTML = ''; st.rThumbs.clear();
      const fr = document.createDocumentFragment();
      for (let i = 1; i <= st.total; i++) {
        const d = document.createElement('div'); d.className = 'thumb-card' + (i === st.page ? ' active' : ''); d.dataset.page = i;
        d.innerHTML = `<canvas width="130" height="175"></canvas><span style="font-size:11px;color:var(--muted);">Page ${i}</span>`;
        d.onclick = () => goPage(i); fr.appendChild(d);
      }
      box.appendChild(fr);
      st.tObs = new IntersectionObserver((es) => es.forEach(async (e) => {
        if (!e.isIntersecting) return; const p = +e.target.dataset.page; if (st.rThumbs.has(p)) return;
        st.rThumbs.add(p);
        try { const pg = await st.pdf.getPage(p), vp = pg.getViewport({ scale: 0.24 }), cv = e.target.querySelector('canvas'); cv.width = vp.width; cv.height = vp.height; await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise; } catch {}
      }), { root: box, rootMargin: '200px 0px' });
      box.querySelectorAll('.thumb-card').forEach((el) => st.tObs.observe(el));
    }

    async function loadTOC() {
      const p = $('panel-outline'); p.innerHTML = '';
      try {
        const o = await st.pdf.getOutline();
        if (!o?.length) { p.innerHTML = '<p style="color:var(--muted);font-size:12px;">No Table of Contents.</p>'; return; }
        const add = (arr, dep = 0) => arr.forEach((it) => {
          const d = document.createElement('div'); d.className = 'outline-item'; d.style.paddingLeft = `${8 + dep*12}px`; d.textContent = it.title;
          d.onclick = async () => { let ds = typeof it.dest === 'string' ? await st.pdf.getDestination(it.dest) : it.dest; if (Array.isArray(ds) && ds[0]) goPage((await st.pdf.getPageIndex(ds[0])) + 1); };
          p.appendChild(d); if (it.items?.length) add(it.items, dep + 1);
        });
        add(o);
      } catch {}
    }

    function updSingle() { wrap.querySelectorAll('.page-shell').forEach((el) => el.classList.toggle('current-single', +el.dataset.page === st.page)); renderPage(st.page); }
    function syncUI(p) {
      st.page = Math.max(1, Math.min(st.total || 1, p));
      $('page-input').value = st.page; $('note-pg').textContent = st.page;
      $('progress').style.width = `${st.total ? st.page / st.total * 100 : 0}%`;
      document.querySelectorAll('.thumb-card.active').forEach((e) => e.classList.remove('active'));
      document.querySelector(`.thumb-card[data-page="${st.page}"]`)?.classList.add('active');
      if (st.key) localStorage.setItem(st.key + '_p', st.page);
    }
    function goPage(p, sm = true) {
      if (!st.pdf) return;
      syncUI(p);
      if (st.view === 'single') { updSingle(); viewer.scrollTop = 0; return; }
      const t = wrap.querySelector(`.page-shell[data-page="${st.page}"]`);
      if (t) { renderPage(st.page); t.scrollIntoView({ behavior: sm ? 'smooth' : 'auto', block: 'start' }); }
    }
    window.goPage = goPage;

    let scT;
    viewer.addEventListener('scroll', () => {
      if (!st.pdf || document.body.classList.contains('mode-library') || st.view === 'single') return;
      clearTimeout(scT); scT = setTimeout(() => {
        const mid = viewer.scrollTop + viewer.clientHeight * 0.35;
        for (const el of wrap.querySelectorAll('.page-shell')) if (el.offsetTop + el.offsetHeight >= mid) { syncUI(+el.dataset.page); break; }
      }, 60);
    });
    async function refresh() { if (!st.pdf) return; const k = st.page; st.tasks.forEach((t) => { try { t.cancel(); } catch {} }); st.tasks.clear(); await calcScale(); await buildPages(); goPage(k, false); }

    // Search
    async function runSearch(q) {
      st.q = q.trim(); st.matches = []; st.mIdx = -1; $('search-results').innerHTML = '';
      document.querySelectorAll('.hl').forEach((e) => e.classList.remove('hl', 'cur'));
      if (!st.pdf || !st.q) { $('search-status').textContent = 'Type to search'; $('search-counter').textContent = ''; return; }
      if (st.texts.length !== st.total) {
        $('search-status').textContent = 'Indexing...'; st.texts = [];
        for (let i = 1; i <= st.total; i++) st.texts.push((await (await st.pdf.getPage(i)).getTextContent()).items.map((x) => x.str).join(' '));
      }
      const ql = st.q.toLowerCase();
      st.texts.forEach((txt, i) => {
        const lw = txt.toLowerCase(); let pos = 0, occ = 0;
        while ((pos = lw.indexOf(ql, pos)) !== -1) { st.matches.push({ p: i+1, occ, sn: txt.slice(Math.max(0, pos-25), Math.min(txt.length, pos+ql.length+35)) }); pos += ql.length; occ++; }
      });
      if (!st.matches.length) { $('search-status').textContent = 'No matches'; $('search-counter').textContent = '0/0'; return; }
      $('search-status').textContent = 'Found';
      const rx = new RegExp(`(${st.q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
      st.matches.slice(0, 50).forEach((m, i) => {
        const d = document.createElement('div'); d.className = 'search-item'; d.dataset.i = i;
        d.innerHTML = `<b>P${m.p}:</b> ...${esc(m.sn).replace(rx, '<mark>$1</mark>')}...`;
        d.onclick = () => jumpM(i); $('search-results').appendChild(d);
      });
      st.rPages.forEach(highlightPage); jumpM(0);
    }
    function highlightPage(n) {
      if (!st.q) return; const ql = st.q.toLowerCase();
      wrap.querySelectorAll(`.page-shell[data-page="${n}"] .textLayer span`).forEach((s) => { if (s.textContent.toLowerCase().includes(ql)) s.classList.add('hl'); });
    }
    async function jumpM(i) {
      if (!st.matches.length) return;
      st.mIdx = (i + st.matches.length) % st.matches.length;
      const m = st.matches[st.mIdx]; $('search-counter').textContent = `${st.mIdx+1}/${st.matches.length}`;
      document.querySelectorAll('.search-item.active').forEach((e) => e.classList.remove('active'));
      document.querySelector(`.search-item[data-i="${st.mIdx}"]`)?.classList.add('active');
      goPage(m.p); await renderPage(m.p); highlightPage(m.p);
      document.querySelectorAll('.hl.cur').forEach((e) => e.classList.remove('cur'));
      const sp = wrap.querySelectorAll(`.page-shell[data-page="${m.p}"] .hl`);
      if (sp.length) { const tg = sp[Math.min(m.occ, sp.length-1)]; tg.classList.add('cur'); tg.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    }

    // Bookmarks & TTS
    const getBMs = () => { try { return JSON.parse(localStorage.getItem(st.key+'_bm') || '[]'); } catch { return []; } };
    function renderBMs() {
      const b = $('bm-list'), l = getBMs();
      b.innerHTML = l.length ? l.map((x) => `<div class="bm-item"><div style="display:flex;justify-content:space-between;margin-bottom:3px;"><b style="color:var(--accent);cursor:pointer;" onclick="goPage(${x.p})">Page ${x.p}</b><button style="background:none;border:none;color:var(--muted);cursor:pointer;" onclick="delBM(${x.id})">✕</button></div><div>${esc(x.n)}</div></div>`).join('') : '<p style="color:var(--muted);font-size:12px;">No bookmarks yet.</p>';
    }
    function addBM(n = '') { if (!st.pdf) return; const l = getBMs(); l.unshift({ id: Date.now(), p: st.page, n: n.trim() || `Page ${st.page}` }); localStorage.setItem(st.key+'_bm', JSON.stringify(l)); renderBMs(); toast(`Bookmarked Page ${st.page}`); }
    window.delBM = (id) => { localStorage.setItem(st.key+'_bm', JSON.stringify(getBMs().filter((x) => x.id !== id))); renderBMs(); };

    function stopTTS() { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); st.tts = false; $('tts-play').textContent = 'Play'; $('tts-st').textContent = `🔊 Page ${st.page}`; }
    async function startTTS() {
      if (!st.pdf || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const txt = (await (await st.pdf.getPage(st.page)).getTextContent()).items.map((x) => x.str).join(' ').trim();
      if (!txt) return toast('No readable text on this page');
      const u = new SpeechSynthesisUtterance(txt); u.rate = +$('tts-rate').value || 1;
      u.onstart = () => { st.tts = true; $('tts-play').textContent = 'Pause'; $('tts-st').textContent = `🔊 Reading P${st.page}`; };
      u.onend = stopTTS; window.speechSynthesis.speak(u);
    }

    // Blogger Embed Modal
    function openEmbed(type, target = '') {
      $('emb-type').value = type;
      if (type === 'pdf') $('emb-pdf').value = target || st.path || st.url || '';
      if (type === 'folder') $('emb-dir').value = target || st.folder || '';
      updEmbed(); $('embed-modal').classList.add('open');
    }
    function updEmbed() {
      const t = $('emb-type').value;
      $('emb-pdf-wrap').style.display = t === 'pdf' ? 'flex' : 'none';
      $('emb-dir-wrap').style.display = t === 'folder' ? 'flex' : 'none';
      const base = window.location.protocol.startsWith('http') ? window.location.href.split('?')[0] : REPO.readerBase;
      const q = new URLSearchParams();
      if (t === 'pdf' && $('emb-pdf').value.trim()) q.set('file', resolveInput($('emb-pdf').value).rel || $('emb-pdf').value.trim());
      if (t === 'folder' && $('emb-dir').value.trim()) q.set('folder', $('emb-dir').value.trim().replace(/^\/+|\/+$/g,''));
      if ($('emb-theme').value !== 'dark') q.set('theme', $('emb-theme').value);
      if ($('emb-clean').checked) q.set('embed', 'true');
      if (!$('emb-dl').checked) q.set('download', '0');
      if ($('emb-dark').checked) q.set('pdfDark', '1');
      const src = q.toString() ? `${base}?${q}` : base, h = $('emb-h').value.trim() || '760px';
      $('emb-out').value = `<div style="width:100%;max-width:100%;margin:16px 0;border-radius:10px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,0.18);">\n  <iframe src="${src}" width="100%" height="${h}" style="border:none;display:block;" allowfullscreen loading="lazy" title="Madhyamik PYQ PDF"></iframe>\n</div>`;
      $('emb-out').dataset.url = src;
    }

    // Events
    const closeMenu = () => $('more-menu').classList.remove('open');
    $('btn-more').onclick = (e) => { e.stopPropagation(); $('more-menu').classList.toggle('open'); };
    document.addEventListener('click', (e) => { if (!e.target.closest('#more-menu') && !e.target.closest('#btn-more')) closeMenu(); });

    $('btn-sidebar').onclick = () => $('sidebar').classList.toggle('collapsed');
    document.querySelectorAll('.sb-tab').forEach((t) => t.onclick = () => {
      document.querySelectorAll('.sb-tab, .sb-panel').forEach((x) => x.classList.remove('active'));
      t.classList.add('active'); $('panel-' + t.dataset.tab).classList.add('active');
    });
    $('btn-home').onclick = () => { if (!document.body.classList.contains('single-embed')) showLib(st.lockRoot); };
    $('btn-back-lib').onclick = () => showLib(st.folder || st.lockRoot);
    $('btn-refresh').onclick = () => { fetchTree(true); toast('Refreshing...'); };
    $('lib-search').oninput = renderLib; $('sb-search').oninput = renderSbFiles;

    $('btn-prev').onclick = () => goPage(st.page - 1);
    $('btn-next').onclick = () => goPage(st.page + 1);
    $('page-input').onchange = (e) => goPage(+e.target.value || 1);
    $('zoom-select').onchange = (e) => { st.zoom = e.target.value; refresh(); };
    $('btn-zoom-in').onclick = () => { st.scale = Math.min(2.5, +(st.scale + 0.25).toFixed(2)); st.zoom = String(st.scale); refresh(); };
    $('btn-zoom-out').onclick = () => { st.scale = Math.max(0.5, +(st.scale - 0.25).toFixed(2)); st.zoom = String(st.scale); refresh(); };
    $('view-mode').onchange = (e) => { st.view = e.target.value; refresh(); closeMenu(); };
    $('theme-select').onchange = (e) => document.documentElement.setAttribute('data-theme', e.target.value);

    $('m-dark').onclick = () => { const on = document.body.classList.toggle('pdf-dark-mode'); $('m-dark-st').textContent = on ? 'ON' : 'OFF'; };
    $('m-rotate').onclick = () => { st.rot = (st.rot + 90) % 360; refresh(); };
    $('m-tts').onclick = () => { closeMenu(); $('tts-bar').classList.toggle('open'); $('tts-st').textContent = `🔊 Page ${st.page}`; };
    $('m-bookmark').onclick = () => { closeMenu(); addBM(); };
    $('m-fullscreen').onclick = () => { closeMenu(); document.fullscreenElement ? document.exitFullscreen?.() : document.documentElement.requestFullscreen?.(); };
    $('m-open').onclick = () => { closeMenu(); $('open-modal').classList.add('open'); };
    const triggerEmbed = () => { closeMenu(); openEmbed(!document.body.classList.contains('mode-library') && (st.path || st.url) ? 'pdf' : st.folder ? 'folder' : 'library', st.path || st.folder || ''); };
    $('m-embed').onclick = triggerEmbed; $('btn-embed-top').onclick = triggerEmbed;
    $('btn-embed-folder').onclick = () => openEmbed(st.folder ? 'folder' : 'library', st.folder);

    $('btn-download').onclick = () => { if (!st.url) return; const a = document.createElement('a'); a.href = st.fbUrl || st.url; a.target = '_blank'; a.download = (st.path || st.url).split('/').pop() || 'doc.pdf'; a.click(); };
    $('btn-save-note').onclick = () => { addBM($('note-input').value); $('note-input').value = ''; };

    $('btn-search').onclick = () => { $('search-bar').classList.toggle('open'); if ($('search-bar').classList.contains('open')) $('search-input').focus(); };
    $('search-close').onclick = () => $('search-bar').classList.remove('open');
    let sd; $('search-input').oninput = (e) => { clearTimeout(sd); sd = setTimeout(() => runSearch(e.target.value), 300); };
    $('search-input').onkeydown = (e) => { if (e.key === 'Enter') jumpM(st.mIdx + (e.shiftKey ? -1 : 1)); };
    $('search-next').onclick = () => jumpM(st.mIdx + 1); $('search-prev').onclick = () => jumpM(st.mIdx - 1);

    $('tts-close').onclick = () => { stopTTS(); $('tts-bar').classList.remove('open'); };
    $('tts-stop').onclick = stopTTS;
    $('tts-play').onclick = () => {
      if (st.tts && window.speechSynthesis.speaking) {
        if (window.speechSynthesis.paused) { window.speechSynthesis.resume(); $('tts-play').textContent = 'Pause'; }
        else { window.speechSynthesis.pause(); $('tts-play').textContent = 'Resume'; }
      } else startTTS();
    };

    document.querySelectorAll('[data-close]').forEach((b) => b.onclick = () => $(b.dataset.close).classList.remove('open'));
    document.querySelectorAll('.modal-bg').forEach((bg) => bg.onclick = (e) => { if (e.target === bg) bg.classList.remove('open'); });
    $('btn-load-url').onclick = () => { const u = $('modal-url').value.trim(); if (!u) return; $('open-modal').classList.remove('open'); loadPDF(u); };
    $('btn-local').onclick = () => { $('open-modal').classList.remove('open'); $('file-input').click(); };
    $('file-input').onchange = (e) => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => loadPDF({ data: new Uint8Array(r.result) }, { name: f.name }); r.readAsArrayBuffer(f); };
    ['emb-type','emb-pdf','emb-dir','emb-theme','emb-h','emb-clean','emb-dl','emb-dark'].forEach((id) => $(id).addEventListener('input', updEmbed));
    $('btn-emb-copy').onclick = () => { navigator.clipboard.writeText($('emb-out').value); toast('Blogger Embed Code copied!'); };
    $('btn-emb-prev').onclick = () => { if ($('emb-out').dataset.url) window.open($('emb-out').dataset.url, '_blank'); };

    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f' && !document.body.classList.contains('mode-library')) { e.preventDefault(); $('search-bar').classList.add('open'); $('search-input').focus(); return; }
      if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) return;
      if (e.key === 'ArrowRight') goPage(st.page + 1);
      else if (e.key === 'ArrowLeft') goPage(st.page - 1);
      else if (e.key === '+' || e.key === '=') $('btn-zoom-in').click();
      else if (e.key === '-') $('btn-zoom-out').click();
      else if (e.key.toLowerCase() === 'r') $('m-rotate').click();
      else if (e.key.toLowerCase() === 'f') $('m-fullscreen').click();
      else if (e.key.toLowerCase() === 'b') addBM();
    });
    let rzt; window.addEventListener('resize', () => { if (!document.body.classList.contains('mode-library') && (st.zoom === 'fit-width' || st.zoom === 'fit-page')) { clearTimeout(rzt); rzt = setTimeout(refresh, 220); } });

    // Boot
    (async function init() {
      const p = new URLSearchParams(window.location.search);
      const file = p.get('file'), dir = (p.get('folder') || '').replace(/^\/+|\/+$/g,'');
      const th = p.get('theme'), emb = p.get('embed'), dl = p.get('download'), dk = p.get('pdfDark'), pg = parseInt(p.get('page')||'',10)||null, vw = p.get('view');
      if (th && ['dark','light','sepia'].includes(th)) { document.documentElement.setAttribute('data-theme', th); $('theme-select').value = th; }
      if (emb === 'true' || emb === '1') document.body.classList.add('embed-mode');
      if (dl === '0' || dl === 'false') document.body.classList.add('no-download');
      if (dk === '1' || dk === 'true') { document.body.classList.add('pdf-dark-mode'); $('m-dark-st').textContent = 'ON'; }
      if (vw && ['continuous','single','book'].includes(vw)) { st.view = vw; $('view-mode').value = vw; }
      if (dir) { st.folder = dir; if (emb === 'true' || emb === '1') st.lockRoot = dir; }
      if (file && (emb === 'true' || emb === '1')) {
        document.body.classList.add('single-embed');
        document.querySelector('[data-tab="thumbs"]').click();
        loadPDF(file, { page: pg });
        return;
      }
      await fetchTree();
      if (file) loadPDF(file, { page: pg });
    })();
  </script>
</body>
</html>
