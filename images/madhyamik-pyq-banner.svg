

<svg xmlns="http://www.w3.org/2000/svg"
     width="672"
     height="229"
     viewBox="0 0 672 229">

  <defs>
    <linearGradient id="pyqBackground"
                    x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4388ee"/>
      <stop offset="50%" stop-color="#398edc"/>
      <stop offset="100%" stop-color="#16a477"/>
    </linearGradient>

    <filter id="bookShadow"
            x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3"
                    stdDeviation="4"
                    flood-opacity=".20"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="672" height="229"
        rx="13" fill="url(#pyqBackground)"/>

  <!-- Decorative Circles -->
  <g fill="#ffffff" opacity=".08">
    <circle cx="97" cy="25" r="30"/>
    <circle cx="630" cy="55" r="95"/>
    <circle cx="28" cy="210" r="60"/>
    <circle cx="653" cy="205" r="45"/>
  </g>

  <!-- Open Book Icon -->
  <g filter="url(#bookShadow)">
    <rect x="45" y="57" width="98" height="113"
          rx="7" fill="#ffffff"/>

    <path d="M94 57 V170"
          stroke="#2879ed"
          stroke-width="2.5"/>

    <path d="M55 80 H87
             M55 103 H87
             M55 126 H87
             M55 149 H87"
          stroke="#4388ee"
          stroke-width="1.5"/>

    <path d="M102 80 H133
             M102 103 H133
             M102 126 H133
             M102 149 H133"
          stroke="#19a878"
          stroke-width="1.5"/>
  </g>

  <!-- Main Title -->
  <g font-family="Arial, sans-serif"
     fill="#ffffff">

    <text x="175" y="85"
          font-size="35"
          font-weight="700">
      Madhyamik PYQ Papers
    </text>

    <path d="M175 102 H595"
          stroke="#ffffff"
          stroke-width="2"
          opacity=".55"/>

    <text x="175" y="132"
          font-size="17">
      2016 – 2027 • English &amp; Bangla Medium
    </text>

    <text x="177" y="164"
          font-size="12.5">
      All Subjects | Free PDF | Year-wise
    </text>

    <text x="224" y="210"
          font-size="10"
          letter-spacing="1.5"
          font-weight="600"
          opacity=".8">
      LEARNING SCIENCE • learningscience.co.in
    </text>

  </g>

  <!-- Free Badge -->
  <rect x="538" y="27"
        width="108" height="33"
        rx="17" fill="#ff8900"/>

  <text x="592" y="48"
        font-family="Arial"
        font-size="13"
        font-weight="bold"
        fill="#ffffff"
        text-anchor="middle">
    ✓ 100% FREE
  </text>

  <!-- WBBSE Badge -->
  <rect x="538" y="180"
        width="108" height="27"
        rx="14" fill="#ffffff"
        opacity=".24"/>

  <text x="592" y="198"
        font-family="Arial"
        font-size="10.5"
        font-weight="bold"
        fill="#ffffff"
        text-anchor="middle">
    WBBSE • Class 10
  </text>

</svg>
