<svg xmlns="http://www.w3.org/2000/svg" width="672" height="229" viewBox="0 0 672 229" role="img" aria-labelledby="title desc">
  <title id="title">Madhyamik PYQ Papers</title>
  <desc id="desc">Previous year question papers from 2016 to 2027 in English and Bangla medium. All subjects, free PDF, year-wise.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3988ee"/>
      <stop offset="0.58" stop-color="#168fca"/>
      <stop offset="1" stop-color="#16a78e"/>
    </linearGradient>
    <linearGradient id="book" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dff7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#063c72" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="672" height="229" rx="15" fill="url(#bg)"/>
  <circle cx="628" cy="34" r="74" fill="#ffffff" opacity=".07"/>
  <circle cx="28" cy="208" r="82" fill="#ffffff" opacity=".06"/>

  <!-- Open book icon -->
  <g transform="translate(34 53)" filter="url(#shadow)">
    <path d="M0 12 Q29 2 57 14 V105 Q29 93 0 103 Z" fill="url(#book)"/>
    <path d="M57 14 Q85 2 114 12 V103 Q85 93 57 105 Z" fill="#eafaff"/>
    <path d="M57 14 V105" stroke="#55a9dc" stroke-width="3"/>
    <g fill="none" stroke="#69b7e7" stroke-width="3" stroke-linecap="round">
      <path d="M13 32 H44 M13 46 H44 M13 60 H44 M13 74 H44"/>
      <path d="M70 32 H101 M70 46 H101 M70 60 H101 M70 74 H101"/>
    </g>
    <path d="M0 12 Q29 2 57 14 Q85 2 114 12" fill="none" stroke="#ffffff" stroke-width="4"/>
  </g>

  <!-- Main text -->
  <text x="176" y="76" fill="#ffffff" font-family="Arial, Helvetica, sans-serif"
        font-size="35" font-weight="800" letter-spacing="-.6">Madhyamik PYQ Papers</text>

  <text x="178" y="112" fill="#ffffff" font-family="Arial, Helvetica, sans-serif"
        font-size="19" font-weight="700">2016–2027  •  English &amp; Bangla Medium</text>

  <text x="179" y="145" fill="#eafaff" font-family="Arial, Helvetica, sans-serif"
        font-size="15" font-weight="600">All Subjects  |  Free PDF  |  Year-wise</text>

  <g transform="translate(170 169)">
    <rect width="280" height="31" rx="14.5" fill="#ffffff" opacity=".18"/>
    <text x="140.5" y="19.5" text-anchor="middle" fill="#ffffff"
          font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700"
          letter-spacing=".4">LEARNING SCIENCE  •  learningscience.co.in</text>
  </g>

  <!-- Free badge -->
  <g transform="translate(534 24)" filter="url(#shadow)">
    <rect width="116" height="34" rx="17" fill="#ff9f1c"/>
    <text x="58" y="22.5" text-anchor="middle" fill="#ffffff"
          font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800">✓ 100% FREE</text>
  </g>

  <!-- Board label -->
  <g transform="translate(535 177)">
    <rect width="120" height="25" rx="12.5" fill="#075b78" opacity=".5"/>
    <text x="58" y="17" text-anchor="middle" fill="#ffffff"
          font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700">WBBSE • CLASS 10</text>
  </g>
</svg>
