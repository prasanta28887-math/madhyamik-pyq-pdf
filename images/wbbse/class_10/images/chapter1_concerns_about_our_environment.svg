  <path d="M340 365 H1120" stroke="#d7fff0" stroke-width="2" opacity=".3"/>
  <text x="340" y="394" fill="#eafff4" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.3">LEARNING SCIENCE  •  learningscience.co.in</text>

  <!-- Small environment badge -->
  <g transform="translate(1000 70)" filter="url(#shadow)">
    <rect width="150" height="42" rx="21" fill="#ffb43b"/>
    <text x="75" y="27" text-anchor="middle" fill="#173d45" font-family="Arial, sans-serif" font-size="15" font-weight="700">WBBSE SYLLABUS</text>
  </g>
